identity:
  name: pi_strategy_native
  author: pi_strategy
  label:
    en_US: Pi Strategy (Native)
    zh_Hans: Pi Strategy（原生）
description:
  en_US: Pi harness execution with Dify-native output for the built-in Dify UI; models, tools, skills and recovery included.
  zh_Hans: 复用 Pi Harness 执行，向 Dify 自带界面输出原生消息；包含模型、工具、技能与恢复。
features:
  - history-messages
parameters:
  - name: model
    type: model-selector
    scope: tool-call&llm
    required: true
    label: {en_US: Model, zh_Hans: 模型}
  - name: query
    type: string
    required: true
    label: {en_US: Query, zh_Hans: 用户输入}
  - name: tools
    type: array[tools]
    required: false
    label: {en_US: Dify tools, zh_Hans: Dify 工具}
  - name: files
    type: files
    required: false
    label: {en_US: Files, zh_Hans: 文件}
    help:
      en_US: Attachment metadata only; map sys.files here.
      zh_Hans: 仅附件元数据；映射 sys.files。
  - name: instruction
    type: string
    required: false
    label: {en_US: Instruction, zh_Hans: 助手指令}
    auto_generate:
      type: prompt_instruction
    template:
      enabled: true
  - name: app_skills_yaml
    type: string
    required: false
    label: {en_US: App skills YAML, zh_Hans: 应用技能 YAML}
    template:
      enabled: true
  - name: mcp_servers_config
    type: string
    required: false
    label: {en_US: Remote MCP servers JSON, zh_Hans: 远程 MCP 服务 JSON}
    help:
      en_US: Remote sse or streamable_http MCP servers. Headers must already be resolved by Dify variables.
      zh_Hans: 仅支持远程 sse 或 streamable_http MCP；headers 必须由 Dify 变量解析完成。
    template:
      enabled: true
  - name: runtime_config
    type: string
    required: false
    label: {en_US: Runtime config JSON, zh_Hans: 运行配置 JSON}
    template:
      enabled: true
  - name: agent_state
    type: string
    required: false
    label: {en_US: Agent state, zh_Hans: Agent 状态}
    template:
      enabled: true
  - name: conversation_id
    type: string
    required: false
    label: {en_US: Conversation ID, zh_Hans: 会话 ID}
    template:
      enabled: true
  - name: user_id
    type: string
    required: false
    label: {en_US: User ID, zh_Hans: 用户 ID}
    template:
      enabled: true
  - name: app_id
    type: string
    required: false
    label: {en_US: App ID, zh_Hans: 应用 ID}
    template:
      enabled: true
output_schema:
  type: object
  properties:
    agent_state:
      type: string
      description:
        en_US: Encoded Pi conversation state to write back into the conversation variable.
        zh_Hans: 回写会话变量的编码 Pi 会话状态。
    answer:
      type: string
      description:
        en_US: Final answer text of this run, also emitted as the `answer` variable.
        zh_Hans: 本次运行的最终回答文本，同时作为 `answer` 变量输出。
    json:
      type: object
      description:
        en_US: Terminal run payload (status, stats, answer, state ref, error).
        zh_Hans: 运行终态 JSON（状态、统计、回答、状态引用、错误）。
extra:
  python:
    source: strategies/pi_strategy_native.py
