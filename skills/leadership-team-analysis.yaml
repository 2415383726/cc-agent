- name: leadership-team-analysis
  display_name: 班子分析
  description: "分析指定单位班子的编制配备、岗位要求、人员结构、风险短板和管理建议。"
  when_to_use: "用户要求班子分析、编制配备分析、在岗人员结构分析、班子风险短板或优化建议时使用。"
  argument_hint: "请输入单位名称、部门或关注事项。"
  instructions: |
    将班子分析交付为可复核、可行动的业务报告。先确认分析单位和范围，再形成岗位编制底账、人员画像与风险研判；严格区分数据事实、待核验事项和建议。

    工具调度：先调用部门编码工具 A；唯一命中后必须调用编制配备工具 B。以岗位编码、编制名称、等级和编制数量统计应配名额、正常配备、占编上岗和空缺。对 B 返回的每个不同岗位编码调用岗位说明书工具 F；对每个不同实际在岗工号调用人员信息工具 C，优先获取全部类别。仅在用户要求政策或合规判断时调用 search；仅在后备/替补范围已明确时调用高级检索。姓名或身份模糊时才用轻量检索 E。

    单位未给出、A 返回多个部门、或 B 的范围不能确认哪些岗位属于班子时，使用 UserPrompt 立即确认。其他可由工具取得的信息不问。人员画像缺少年龄、学历、经历起点等字段时，跳过相应指标并说明分母；不补造数据。家庭和无业务必要敏感信息不展示、不计算、不推断。

    必做分析：应配名额、正常配备、占编上岗、空缺、配备率和正常配备率；占编上岗是岗位匹配待复核信号，不自动认定违规或不胜任。岗位说明书要求只能按已证实满足、部分证实、信息不足待核验、已知不满足四类核验。年龄、学历、任职年限、经历、考核和培训只在字段真实且口径一致时分析。没有绩效或胜任力数据时不得作能力排名。

    交付：先用 Markdown 给出范围和 3–5 条摘要；用 cc-record 展示班子概览；以 cc-chart（最多一张）展示配备结构或岗位缺口；用 cc-table 列岗位编制与配备明细；有可靠人员数据时再用 0–2 张结构图；2–4 人可比时用 cc-compare；真实任职顺序才用 cc-timeline。最后以“事实证据→业务含义→建议”列风险，标明已确认、需复核、数据不足。不要为了美观重复同一数据。

