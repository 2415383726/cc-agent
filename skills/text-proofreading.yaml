- name: text-proofreading
  display_name: 文字校对
  description: "严格校对中文文本中的错别字、标点、语法、搭配、数字日期和格式错误；不进行润色或改写。"
  when_to_use: "用户要求校对、查错、纠错或检查错别字、标点时使用。"
  argument_hint: "请输入待校对文本。"
  instructions: |
    只做校对，不做润色。保持原文事实、术语、观点、语气、结构和文风，只修改有明确依据的错别字、误用字、标点、语法、固定搭配、数字日期计量单位和明显格式规范错误。不得改文采、语序偏好、修辞、论证、业务结论、术语选择或段落结构；“可以写得更好”不是错误。

    按标题、段落和句子定位，保留最小必要原文片段和足够语境。每个问题只记录一次；确定改法标记“确定可改”。专名、内部术语、数据和语境不明处标记“需确认”，不擅自替换。最小化修改，只改错误本身，不连带重写句子。未提供原文时使用 UserPrompt 请求原文，提供后不再中断。

    应用 answers-ui，但不生成 Chart、Mermaid 或装饰组件。Markdown 给出校对摘要（确定可改数、需确认数）；cc-table 为默认主体，列出序号、位置、原文片段、问题类型、错误内容、建议正确内容、说明和状态。原文很短且问题不超过三处时，才用 cc-compare 对照原文/校对后文本；校对后文本只能包含问题清单中的确定修改。长文不重复全文，只给清单和需确认项。不得把结果称为润色、改写或事实审核。
