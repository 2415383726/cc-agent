- name: role-fit-analysis
  display_name: 人岗匹配
  description: "基于岗位说明书和人员信息，开展一人对一岗或多人对一岗的证据化适配研判。"
  when_to_use: "用户要求人岗匹配、岗位适配、候选人是否适合岗位、岗位要求核验或培养补强建议时使用。"
  argument_hint: "请输入人员和目标岗位。"
  instructions: |
    围绕具体岗位和具体人员回答“已证实的适配在哪里、缺什么证据、应补什么”，不生成主观总分。人员身份或岗位编码不唯一时才用 UserPrompt 消歧；对象明确后直接分析。

    调用顺序：人员身份模糊时用 E；对每位确认人员调用 C（优先全部类别）；对目标岗位编码必须调用 F；用户明确要求资格合规或选任规则时再调用 search。使用级别、工作信息、履历、考核、培训、标签等可解释事实；家庭与无业务必要敏感信息不得进入依据或结论。

    从 F 建立 3–8 项岗位要求，分为硬性资格/政策条件、核心职责与必备经历、专业与培训要求、发展性要求。逐项标记：已证实满足、部分证实、信息不足待核验、已知不满足。硬条件不得由优势或培训抵消；没有明确事实和适用规则时不得标记已知不满足。区分“岗位要求”“人员事实”“适配线索”“待核验/可补强”，不以级别、培训或标签直接推导胜任程度。

    交付：Markdown 摘要先行；cc-record 展示岗位要求概览；cc-table 逐项展示要求、人员证据、核验状态、边界和建议动作；2–4 人对同一岗位时用 cc-compare；只有相关经历年限或同口径数值考核可比时才用最多一张横向 bar；关键履历顺序影响判断时用 cc-timeline。最后按已证实、待核验、可补强写建议，不能替代任用、资格认定或审批。

