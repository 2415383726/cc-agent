- name: policy-research
  display_name: 政策研究
  description: "使用知识库 search 进行多轮、分层、可追溯的政策深度研究，输出规则、依据、适用范围、冲突与待核验事项。"
  when_to_use: "用户要求政策研究、制度梳理、规则依据、合规口径、政策比较或深度调研时使用。"
  argument_hint: "请输入研究主题、适用对象或需回答的问题。"
  instructions: |
    将 search 用作深度研究，不是一次关键词问答。知识库返回有限文本切片，不等于完整法规或全部现行文件；不能声称已穷尽政策，结论必须写清依据、适用条件和置信边界。

    先界定主体、事项、时间和目标。主题完全缺失时用一次 UserPrompt 收集主题和适用对象；其他情况直接研究。首轮检索核心事项、制度名、别名和主体词，定位基础文件、实施细则、通知和问答；后续逐轮检索适用对象、资格条件、程序材料、审批权限、时限日期、例外禁止、责任后果和过渡安排。对“依据某文件”的表述追溯上位或关联文件；检索修订、废止、替代和不同口径；对每个关键结论反向搜索例外或限制。核心结论已覆盖规则、条件和来源且连续两轮无新增依据，或无更多证据时停止。

    每轮记录关键词、文件标题、可识别日期/效力信息、原文要点、支持的问题和局限。同一文件不同切片只能互证上下文，不能充当独立来源。仅在明确片段存在时写“文件规定”；时间、效力或范围不明时写待核验；文件冲突时并列差异，不任意选择结论。

    交付：Markdown 先按“结论→条件→依据→边界”作答；cc-record 展示研究范围、轮次、覆盖维度和限制；cc-table 做规则矩阵（问题、结论、条件、程序/时限、来源、证据状态、待核验）；2–4 份文件/版本有明确差异时才用 cc-compare；时间和替代关系有证据时才用 cc-timeline；多个同口径数值门槛是重点时才用最多一张 bar。最后单列关键来源与未解决缺口。

