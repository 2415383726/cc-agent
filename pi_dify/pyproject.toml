[project]
name = "pi-dify-agent"
version = "0.1.0"
description = "Pi harness Dify Agent Strategy"
requires-python = ">=3.12"
dependencies = [
    "dify-plugin==0.7.4",
    "pi-agent-core-lc==0.6.0",
    "pi-agent-harness-lc==0.6.0",
    "mcp==1.26.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "pydantic>=2.0",
    "pathspec>=0.12",
]

[tool.black]
line-length = 100
skip-string-normalization = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "SIM", "PIE", "TRY", "ISC"]
# Boundary code catches broad SDK exceptions by design and intentionally
# ignores cleanup failures. These are reviewed at each call site.
ignore = [
    "BLE001", "S110", "S112", "TRY003", "TRY004", "TRY300", "TRY301", "TRY400",
    "SIM105", "SIM108", "ISC004",
]

[tool.ruff.lint.per-file-ignores]
"tests/_support.py" = ["E402"]
