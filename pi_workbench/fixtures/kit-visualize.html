</div>

</div>

const get = id => document.getElementById(id);
const arrival = get('arrival'), service = get('service'), second = get('second');
let minute = 30, playing = false;
const number = value => Number(value).toFixed(1);
function calculate() {
  let queue = 0;
  return observations.filter(row => row.minute <= minute).map(row => {
    const entering = row.demand * Number(arrival.value) / 3;
    const leaving = row.capacity * Number(service.value) / 2 * (second.checked ? 2 : 1);
    queue = Math.max(0, queue + (entering - leaving) / 3);
    return { minute: row.minute, entering, leaving, queue };
  });
}
function render() {
  const rows = calculate(), last = rows[rows.length - 1];
  const rate = Number(arrival.value), capacity = Number(service.value) * (second.checked ? 2 : 1);
  const colors = PiViz.getTheme().colors;
  get('arrival-value').textContent = number(rate) + ' 人/分钟';
  arrival.setAttribute('aria-valuetext', number(rate) + ' 人/分钟');
  get('arrival-rate').textContent = number(rate);
  get('service-rate').textContent = number(capacity);
  get('elapsed').textContent = String(minute);
  get('backlog').textContent = number(last.queue);
  get('motion').textContent = PiViz.reducedMotion ? '已减少动画；可手动播放或调参。' : '每秒前进 1 分钟，可随时暂停。';
  const rateWidth = get('rates').clientWidth;
  get('arrival-bar').setAttribute('width', String(rateWidth * rate / 8));
  get('service-bar').setAttribute('width', String(rateWidth * capacity / 8));
  const width = Math.max(180, get('trend').clientWidth), height = 230;
  const x = d3.scaleLinear().domain([0, 120]).range([36, width - 12]);
  const y = d3.scaleLinear().domain([0, Math.max(10, d3.max(rows, row => row.queue))]).nice().range([height - 32, 12]);
  const svg = d3.select('#trend').attr('viewBox', '0 0 ' + width + ' ' + height);
  svg.selectAll('*').remove();
  svg.append('g').attr('transform', 'translate(0,' + (height - 32) + ')').call(d3.axisBottom(x).ticks(width < 350 ? 3 : 6).tickFormat(value => value + ''));
  svg.append('g').attr('transform', 'translate(36,0)').call(d3.axisLeft(y).ticks(4));
  svg.selectAll('.domain,.tick line').attr('stroke', colors.border);
  svg.selectAll('.tick text').attr('fill', colors.text).style('font-size', '12px');
  svg.append('path').datum(rows).attr('fill', 'none').attr('stroke', colors.series1).attr('stroke-width', 2.5).attr('d', d3.line().x(row => x(row.minute)).y(row => y(row.queue)));
  const canvas = get('people'), context = canvas.getContext('2d');
  const cssWidth = Math.max(180, canvas.clientWidth), dpr = devicePixelRatio || 1;
  canvas.style.width = '100%'; canvas.style.height = '74px'; canvas.width = cssWidth * dpr; canvas.height = 74 * dpr;
  context.scale(dpr, dpr); context.fillStyle = colors.background; context.fillRect(0, 0, cssWidth, 74);
  context.fillStyle = colors.series3;
  const columns = Math.max(10, Math.floor(cssWidth / 15));
  for (let i = 0; i < Math.min(40, Math.round(last.queue)); i++) { context.beginPath(); context.arc(8 + (i % columns) * 15, 10 + Math.floor(i / columns) * 17, 5, 0, Math.PI * 2); context.fill(); }
  canvas.setAttribute('aria-label', '当前排队约 ' + number(last.queue) + ' 人，最多显示40个圆点。');
  get('data-rows').replaceChildren(...rows.slice(-8).map(row => {
    const tr = document.createElement('tr');
    for (const value of [row.minute, row.entering, row.leaving, row.queue]) { const td = document.createElement('td'); td.textContent = number(value); tr.append(td); }
    return tr;
  }));
}
function setPlaying(next) {
  playing = next;
  get('play').setAttribute('aria-pressed', String(playing));
  get('play').querySelector('span').textContent = playing ? '暂停' : '播放';
}
arrival.addEventListener('input', render); service.addEventListener('change', render); second.addEventListener('change', render);
get('play').addEventListener('click', () => setPlaying(!playing));
get('reset').addEventListener('click', () => { arrival.value = '3'; service.value = '2'; second.checked = false; minute = 30; setPlaying(false); render(); });
addEventListener('piviz:themechange', render); addEventListener('resize', render);
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', event => { if (event.matches) setPlaying(false); render(); });
setInterval(() => { if (playing) { minute = minute >= 119 ? 1 : minute + 1; render(); } }, 1000);
render();
})();
