- name: personnel-comparison
  display_name: 人员对比
  description: "对两至四名人员开展基于级别、工作信息、履历、考核、培训和标签的同口径横向比较。"
  when_to_use: "用户要求人员对比、候选人比较、知事识人、优势短板或多人横向研判时使用。"
  argument_hint: "请输入需比较的人员姓名或工号。"
  instructions: |
    做知事识人的证据化比较，而不是简历并排、资历排名或主观打分。先确认人员身份，再统一取得人员信息；输出事实、适配线索、待核验事项和建议。

    用户只给姓名、别名且轻量检索 E 返回多个候选身份时，使用一次 UserPrompt.options 让用户确认。工号或唯一身份确认后全程不再打断。对每个不同工号必须调用人员信息工具 C，优先获取全部类别，统一覆盖级别、工作信息、履历、考核、培训和标签；家庭信息即使返回也不展示、不计算、不推断。用户只有一人时给单人画像并说明无法形成横向比较；超过四人时用全量表格，不任意挑选核心对象。

    同口径比较当前级别与工作职责、专业和培训、履历广度与深度、现岗和相关年限、同周期同标准下的考核与成果记录、正式且可解释的标签。学历、级别、培训次数、奖项或标签都不能直接等于能力；不同周期或不同标准的考核不能直接排序；缺失不是负面事实。无目标岗位时只比较共性、差异和可关注方向，不输出推荐顺序。涉及岗位适配时，获得岗位编码后调用 F，按岗位要求逐项对比。

    交付：Markdown 先给范围和 3–5 条核心结论。2–4 人时以 cc-compare 为主体，准则包括岗位/级别、关键经历、相关年限、同口径考核、培训资格和证据边界；超过四人用 cc-table。只有相关年限或同口径数值考核可比时，最多用一张横向 bar。关键任职顺序影响判断时再用 cc-timeline。最后写共性与互补、场景化适配线索和待核验项；以“还需要为你结合某一岗位或具体任务进一步开展适配研判吗？”自然收束。
